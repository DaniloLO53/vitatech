# A porta que o Render vai definir dinamicamente
server.port=${PORT:8080}

# Conexão com o banco de dados via variáveis de ambiente
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# O Flyway vai criar as tabelas automaticamente no Neon
spring.flyway.enabled=true
spring.flyway.url=jdbc:${DATABASE_URL}
spring.flyway.user=${DATABASE_USER}
spring.flyway.password=${DATABASE_PASSWORD}

# A sua chave JWT secreta (passe a usar uma variável de ambiente aqui também)
api.security.token.secret=${JWT_SECRET:chave_secreta_padrao_local}